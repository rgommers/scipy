name: Cross-only compilation environment

concurrency:
  group: nonnative-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - ci-cross-314t

permissions:
  contents: read

jobs:
  cross_conda_aarch64_build:
    name: Cross x86-64 to aarch64
    if: "github.repository == 'rgommers/scipy' || github.repository == ''"
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash -el {0}
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Setup Conda
      uses: conda-incubator/setup-miniconda@505e6394dae86d6a5c7fbb6e3fb8938e3e863830 # v3.1.1
      with:
        python-version: ${{ matrix.python-version }}
        channels: conda-forge
        channel-priority: true
        activate-environment: ""
        use-only-tar-bz2: false
        miniforge-variant: Miniforge3
        miniforge-version: latest
        use-mamba: true

    - name: Set up x86-64 build env (native)
      run: |
        #mamba create -n build-env gxx_linux-aarch64 gfortran_linux-aarch64 python-freethreading=3.14 meson-python python-build numpy pythran cython pkg-config pybind11
        mamba create -n build-env gxx_linux-aarch64 gfortran_linux-aarch64 python=3.14 meson-python python-build numpy pythran cython pkg-config pybind11

    - name: Install meson from branch with PEP 739 support
      shell: bash -el {0}
      run: |
        conda activate build-env
        python -m pip install git+https://github.com/rgommers/meson-python.git@pep-739-cross
        python -m pip install git+https://github.com/mesonbuild/meson.git

    - name: Set up aarch64 host env (cross)
      run: |
        #CONDA_SUBDIR=linux-aarch64 mamba create -n host-env python-freethreading=3.14 numpy openblas libstdcxx-ng libgfortran-ng
        CONDA_SUBDIR=linux-aarch64 mamba create -n host-env python=3.14 numpy openblas libstdcxx-ng libgfortran-ng

    - name: Check for build-details.json
      run: |
        ls /home/runner/miniconda3/envs/host-env/lib
        ls /home/runner/miniconda3/envs/host-env/lib/python3.14

    - name: Cross-compile SciPy
      shell: bash -el {0}
      run: |
        conda activate build-env
        # We're cross-compiling, so unset these environment variables that the
        # activate scripts define:
        unset CFLAGS
        unset CXXFLAGS
        unset FFLAGS
        unset LDFLAGS
        # NOTE: without this export, I see:
        #   Determining dependency 'openblas' with pkg-config executable '/usr/share/miniconda3/envs/build-env/bin/pkg-config'
        #   env[PKG_CONFIG_PATH]:
        #   env[PKG_CONFIG_SYSROOT_DIR]: /usr/share/miniconda3/envs/host-env/
        #   env[PKG_CONFIG_LIBDIR]: /usr/share/miniconda3/envs/host-env/lib/pkgconfig
        #   Called `/usr/share/miniconda3/envs/build-env/bin/pkg-config --modversion openblas` -> 1
        #   stderr:
        #   Package openblas was not found in the pkg-config search path.
        #   Perhaps you should add the directory containing `openblas.pc'
        #   to the PKG_CONFIG_PATH environment variable
        #   No package 'openblas' found
        #
        # NOTE: the sys_root and pkg_config_libdir in the cross file (as per
        #       the Meson docs) are ineffective, both in CI and locally.
        #       In addition, using `sys_root` breaks including Python.h
        export HOST_ENV=/home/runner/miniconda3/envs/host-env
        export PKG_CONFIG_PATH=$HOST_ENV/lib/pkgconfig

        # `-wnx` means: `--wheel --no-isolation --skip-dependency-check`
        python -m build -wnx -Cbuild-dir=build -Csetup-args=--cross-file=$PWD/ci/cross_aarch64.ini -Csetup-args=-Dpython.build_config=$HOST_ENV/lib/python3.14/build-details.json

    - name: auditwheel show
      shell: bash -el {0}
      run: |
        python -m pip install auditwheel
        auditwheel show dist/*.whl

    - name: Show meson-log.txt
      if: always()
      run: |
        cat build/meson-logs/meson-log.txt

    - uses: actions/upload-artifact@v4
      with:
        name: aarch64-wheel
        path: dist

  cross_conda_aarch64_test:
    name: Test on aarch64
    needs: cross_conda_aarch64_build
    if: "github.repository == 'rgommers/scipy' || github.repository == ''"
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: aarch64-wheel
        path: dist

    - name: Setup Conda
      uses: conda-incubator/setup-miniconda@505e6394dae86d6a5c7fbb6e3fb8938e3e863830 # v3.1.1
      with:
        python-version: ${{ matrix.python-version }}
        channels: conda-forge
        channel-priority: true
        activate-environment: ""
        use-only-tar-bz2: false
        miniforge-variant: Miniforge3
        miniforge-version: latest
        use-mamba: true

    - name: Set up test env
      run: |
        mamba create -n test-env python numpy openblas pytest hypothesis pooch

    - name: Install SciPy wheel
      shell: bash -el {0}
      run: |
        conda activate test-env
        python -m pip install dist/scipy*.whl

    - name: Run test suite
      shell: bash -el {0}
      run: |
        conda activate test-env
        pytest --pyargs scipy
